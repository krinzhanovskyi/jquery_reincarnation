<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interaktive Galerie</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  </head>
  <body>
    <h1 style="text-align: center">Meine jQuery Galerie</h1>
    <div class="gallery">
      <img class="thumb" src="pictures/picture1.jpeg" alt="Bild 1" />
      <img class="thumb" src="pictures/picture2.jpeg" alt="Bild 2" />
      <img class="thumb" src="pictures/picture3.jpeg" alt="Bild 3" />
    </div>
    <div id="myModal" class="modal">
      <span class="close-btn">&times;</span>
      <img class="modal-content" id="fullImage" />
    </div>

    <script src="script.js"></script>
  </body>
</html>
